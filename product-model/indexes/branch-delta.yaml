contextual_changes:
  capabilities:
    - capability_id: CAP-002
      capability_name: Validate and project product model
      change_notes: []
      description: Enables users to validate product events and regenerate the current-state product model.
      features:
        - change_notes:
            - added
          description: Reports product events unique to a working branch relative to a base branch.
          feature_id: FEAT-012
          feature_name: Report branch delta
          requirements:
            - acceptance_criteria:
                - acceptance_criterion_id: AC-018
                  change_notes:
                    - added
                  tests:
                    - test_id: TEST-019
                  text: Given a working branch with product events not contained in the base branch, when the branch-delta helper is run, then it reports the branch-only product events relative to the base branch.
                - acceptance_criterion_id: AC-019
                  change_notes:
                    - added
                  tests:
                    - test_id: TEST-020
                  text: Given a base branch that cannot be resolved, when the branch-delta helper is run, then it fails instead of emitting a trusted branch-delta report.
              change_notes:
                - added
              description: The system shall compare the current branch against a base branch and report the product events unique to the current branch.
              requirement_id: REQ-012
            - acceptance_criteria:
                - acceptance_criterion_id: AC-020
                  change_notes:
                    - added
                  tests:
                    - test_id: TEST-021
                  text: Given branch-only product events affecting capabilities, features, requirements, acceptance criteria, or tests, when the branch-delta helper is run, then it reports the changed entities grouped by entity type and change kind.
                - acceptance_criterion_id: AC-021
                  change_notes:
                    - added
                  tests:
                    - test_id: TEST-022
                  text: Given branch-only product events spanning additive, refinement, reshaping, deprecation, verification, or readiness changes, when the branch-delta helper is run, then it reports the inferred change categories present in the branch delta.
              change_notes:
                - added
              description: The system shall summarize changed product entities and inferred change categories in the branch-delta report.
              requirement_id: REQ-013
            - acceptance_criteria:
                - acceptance_criterion_id: AC-022
                  change_notes:
                    - added
                  tests:
                    - test_id: TEST-023
                    - test_id: TEST-024
                  text: Given changed entities in the branch delta, when the branch-delta helper is run, then it reports the impacted capabilities, features, requirements, acceptance criteria, and tests related to those changes.
                - acceptance_criterion_id: AC-023
                  change_notes:
                    - added
                    - changed
                  tests:
                    - test_id: TEST-025
                    - test_id: TEST-026
                  text: Given a working branch and base branch, when the branch-delta helper is run without a custom output path, then it writes product-model/indexes/branch-delta.yaml and product-model/branch-delta.md as generated artifacts, and the markdown presents changed entities in parent context with explicit change labels.
              change_notes:
                - added
                - changed
              description: The system shall report impacted product entities and write standard branch-delta artifacts for the current branch in machine-readable YAML and human-readable contextual Markdown.
              requirement_id: REQ-014
