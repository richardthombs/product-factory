name: product-model

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-and-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Rebuild product model
        run: npm run rebuild

      - name: Verify generated output is committed
        run: git diff --exit-code -- product-model
